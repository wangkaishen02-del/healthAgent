services:
  postgres:
    image: postgres:17-alpine
    container_name: healthagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthagent
      POSTGRES_USER: healthagent
      POSTGRES_PASSWORD: healthagent_local
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - healthagent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthagent -d healthagent"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  ocr:
    build:
      context: ./services/ocr
    container_name: healthagent-ocr
    restart: unless-stopped
    init: true
    environment:
      OCR_MAX_FILE_BYTES: "12582912"
      OCR_MAX_IMAGE_PIXELS: "30000000"
      OCR_MAX_PDF_PAGES: "10"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 4
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'))['ready']",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  healthagent_postgres_data:
    name: healthagent_postgres_data
