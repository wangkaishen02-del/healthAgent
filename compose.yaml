services:
  postgres:
    image: postgres:17-alpine
    container_name: healthagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthagent
      POSTGRES_USER: healthagent
      POSTGRES_PASSWORD: healthagent_local
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - healthagent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthagent -d healthagent"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  keycloak-postgres:
    image: postgres:17-alpine
    container_name: healthagent-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local_change_me}
      TZ: Asia/Shanghai
    volumes:
      - healthagent_keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: healthagent-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_change_me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local_change_me}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:18081
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./infra/keycloak/realm-healthagent.json:/opt/keycloak/data/import/realm-healthagent.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  ocr:
    build:
      context: ./services/ocr
    container_name: healthagent-ocr
    restart: unless-stopped
    init: true
    environment:
      OCR_MAX_FILE_BYTES: "12582912"
      OCR_MAX_IMAGE_PIXELS: "30000000"
      OCR_MAX_PDF_PAGES: "10"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 4
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'))['ready']",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  healthagent_postgres_data:
    name: healthagent_postgres_data
  healthagent_keycloak_postgres_data:
    name: healthagent_keycloak_postgres_data
