name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: healthagent
          POSTGRES_USER: healthagent
          POSTGRES_PASSWORD: ci-healthagent-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthagent -d healthagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://healthagent:ci-healthagent-password@127.0.0.1:5432/healthagent?schema=public
      AUTH_ENABLED: "false"
      NEXT_PUBLIC_AUTH_ENABLED: "false"
      LANGGRAPH_CHECKPOINTER: memory
      ASSISTANT_LOG_LEVEL: off

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Initialize test database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npx prisma db execute --schema prisma/schema.prisma --file infra/database/current-schema-post-push.sql
          npm run db:seed
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run service and workflow tests
        run: |
          npm run test:assistant-privacy
          npm run test:assistant-graph
          npm run test:claim-state-machine
          npm run test:claim-workflow
          npm run test:api
          npm run test:auto-calculation
      - name: Build Web and API
        run: npm run build
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
