<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>healthAgent 承保查询系统</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-brand">healthAgent 承保管理系统</div>
      <nav class="topnav">
        <div class="menu-item active">
          <button id="menu-trigger" class="menu-trigger">综合查询 ▾</button>
          <div id="menu-dropdown" class="dropdown hidden">
            <button id="open-policy-query" class="dropdown-item">保单信息查询</button>
            <button id="open-claim-query" class="dropdown-item">案件查询</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="workspace">
      <div class="tabs-bar">
        <button id="query-tab" class="tab active">保单信息查询</button>
        <button id="claim-tab" class="tab">案件查询</button>
      </div>

      <section id="policy-query-page" class="page-section">
        <section class="panel query-panel">
          <div class="section-title">查询条件</div>
          <form id="search-form" class="query-form">
            <label>
              <span>保单号</span>
              <input class="filter-control" id="policyNo" name="policyNo" placeholder="例如 GI2026000001" />
            </label>
            <label>
              <span>投保单位</span>
              <input class="filter-control" id="applicantName" name="applicantName" placeholder="例如 华曜科技" />
            </label>
            <label>
              <span>被保人姓名</span>
              <input class="filter-control" id="insuredName" name="insuredName" placeholder="例如 张晨" />
            </label>
            <label>
              <span>被保人证件号</span>
              <input class="filter-control" id="insuredIdNo" name="insuredIdNo" placeholder="例如 310101..." />
            </label>
            <label>
              <span>保单状态</span>
              <div class="custom-select" id="policyStatusSelect">
                <input type="hidden" id="policyStatus" name="policyStatus" value="" />
                <button type="button" class="filter-control custom-select-trigger" id="policyStatusTrigger" aria-haspopup="listbox" aria-expanded="false">
                  <span id="policyStatusLabel">全部</span>
                  <span class="select-arrow" aria-hidden="true">▾</span>
                </button>
                <div class="custom-select-menu hidden" id="policyStatusMenu" role="listbox">
                  <button type="button" class="custom-select-option active" data-value="">全部</button>
                  <button type="button" class="custom-select-option" data-value="active">active</button>
                  <button type="button" class="custom-select-option" data-value="draft">draft</button>
                  <button type="button" class="custom-select-option" data-value="expired">expired</button>
                  <button type="button" class="custom-select-option" data-value="cancelled">cancelled</button>
                </div>
              </div>
            </label>
            <div class="query-actions">
              <button type="submit">查询</button>
              <button type="button" id="reset-form" class="secondary-button">重置</button>
            </div>
          </form>
        </section>

        <section class="panel result-panel">
          <div class="panel-title-row">
            <div class="section-title">查询结果</div>
            <span id="policy-count" class="muted">0 条</span>
          </div>
          <div class="result-table-shell">
            <div class="table-wrapper result-table-wrapper">
              <table>
                <thead>
                <tr>
                  <th class="index-col">序号</th>
                  <th>保单号</th>
                  <th>保单名称</th>
                  <th>投保单位</th>
                  <th>状态</th>
                  <th>生效日期</th>
                  <th>终止日期</th>
                  <th>被保人数</th>
                  <th class="actions-col">操作</th>
                </tr>
                </thead>
                <tbody id="policy-table-body"></tbody>
              </table>
            </div>
            <div id="policy-pagination" class="pagination"></div>
          </div>
        </section>

        <div id="drawer-overlay" class="drawer-overlay hidden">
          <aside id="drawer-panel" class="drawer-panel">
            <div class="drawer-header">
              <div>
                <div class="section-title">保单详情</div>
                <div id="drawer-policy-title" class="muted"></div>
              </div>
              <div class="drawer-header-actions">
                <span id="drawer-status-badge" class="status-badge"></span>
                <button id="drawer-close" type="button" class="secondary-button">关闭</button>
              </div>
            </div>
            <div id="drawer-body" class="drawer-body"></div>
          </aside>
        </div>
      </section>

      <section id="claim-query-page" class="page-section hidden">
        <section class="panel empty-state">
          <h3>案件查询</h3>
          <p>该功能入口已预留，当前阶段暂未接入案件数据与查询条件。</p>
          <p class="muted">后续会在这里承接理赔受理、案件检索、详情查看和理算结果联查。</p>
        </section>
      </section>

    </main>

    <script type="module" src="/app.js"></script>
  </body>
  </html>
